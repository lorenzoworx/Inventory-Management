name: Check milestone

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: ims
          POSTGRES_PASSWORD: ims_test
          POSTGRES_DB: ims_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ims -d ims_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://ims:ims_test@127.0.0.1:5432/ims_test
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run check
      - uses: actions/upload-artifact@v7.0.1
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7

  container:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check:container
      - name: Container logs on failure
        if: failure()
        run: |
          export IMS_COMPOSE_PROJECT="ims-ci-${GITHUB_RUN_ID}"
          export IMS_DEPLOY_ENV=.local/container-check.env
          export IMS_DATABASE_FILE=.local/container-check-database
          export IMS_LOCAL_HTTP=1
          npm run deploy -- logs
      - name: Remove isolated CI containers and data
        if: always()
        run: docker compose --env-file .local/container-check.env -p "ims-ci-${GITHUB_RUN_ID}" -f compose.yaml -f deploy/compose.local.yaml down --volumes
